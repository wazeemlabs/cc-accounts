name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch a Claude Code release that changes what cca reads.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: make lint
      - run: make test-shell test-python

  claude-code:
    name: Against the latest Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: make test-python test-plugin
